<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Outer hexagonal frame -->
  <polygon points="256,16 460,140 460,372 256,496 52,372 52,140"
           fill="#1a1a2e" stroke="#00bcd4" stroke-width="7"/>
  <!-- Inner hexagonal ring -->
  <polygon points="256,56 420,162 420,350 256,456 92,350 92,162"
           fill="none" stroke="#00bcd4" stroke-width="1.5" opacity="0.35"/>
  <!-- Targeting reticle cross-hairs -->
  <line x1="256" y1="76"  x2="256" y2="196" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="316" x2="256" y2="436" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="96"  y1="256" x2="196" y2="256" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="316" y1="256" x2="416" y2="256" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <!-- Tick marks on reticle -->
  <line x1="248" y1="196" x2="264" y2="196" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="248" y1="316" x2="264" y2="316" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="196" y1="248" x2="196" y2="264" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <line x1="316" y1="248" x2="316" y2="264" stroke="#00bcd4" stroke-width="2" opacity="0.5"/>
  <!-- Raptor eye — outer ring -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="#00bcd4" stroke-width="3"/>
  <!-- Raptor eye — mid ring -->
  <circle cx="256" cy="256" r="52" fill="none" stroke="#00bcd4" stroke-width="1.5" opacity="0.5"/>
  <!-- Raptor eye — iris glow -->
  <circle cx="256" cy="256" r="38" fill="#00bcd4" opacity="0.18"/>
  <!-- Raptor eye — pupil -->
  <circle cx="256" cy="256" r="18" fill="#00bcd4"/>
  <!-- Angular hawk-beak accent (right) -->
  <path d="M280,256 L342,222 L320,256 L342,290 Z" fill="#e94560" opacity="0.85"/>
  <!-- Wing-sweep accents (left) -->
  <path d="M172,196 L216,232 L252,240" fill="none" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M172,316 L216,280 L252,272" fill="none" stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <!-- Small circuit dots at hexagon vertices -->
  <circle cx="256" cy="16"  r="5" fill="#00bcd4" opacity="0.6"/>
  <circle cx="460" cy="140" r="5" fill="#00bcd4" opacity="0.6"/>
  <circle cx="460" cy="372" r="5" fill="#00bcd4" opacity="0.6"/>
  <circle cx="256" cy="496" r="5" fill="#00bcd4" opacity="0.6"/>
  <circle cx="52"  cy="372" r="5" fill="#00bcd4" opacity="0.6"/>
  <circle cx="52"  cy="140" r="5" fill="#00bcd4" opacity="0.6"/>
</svg>
